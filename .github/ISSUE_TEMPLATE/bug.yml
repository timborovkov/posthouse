name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A short description is enough to start.

        Please do **not** include passwords, tokens, cache keys, message bodies, calendar contents, or other private provider data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, TUI steps, or MCP tool calls if you have them. Optional but helpful.
  - type: input
    id: version
    attributes:
      label: Posthouse version
      description: Output of `posthouse version`, or "from source" plus a commit if you know it.
      placeholder: 0.2.0
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      multiple: true
      options:
        - CLI
        - TUI
        - MCP stdio
        - MCP HTTP
        - Docker
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs with secrets redacted, provider protocol (IMAP/SMTP/CalDAV/ICS), OS, or related issues.
