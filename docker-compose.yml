services:
  posthouse:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8791:8791"
    volumes:
      - ./data:/data
    environment:
      POSTHOUSE_MCP_TOKEN: ${POSTHOUSE_MCP_TOKEN:?set POSTHOUSE_MCP_TOKEN in .env}
      ACME_MAIL_PASSWORD: ${ACME_MAIL_PASSWORD:-}
      ACME_CALENDAR_ICS_URL: ${ACME_CALENDAR_ICS_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8791/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
